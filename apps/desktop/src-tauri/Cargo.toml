[package]
name = "mynote"
version = "0.5.0"
description = "Block-based notes on plain Markdown + git, open to AI agents over MCP"
authors = ["Devian Labs and contributors"]
license = "MIT"
repository = "https://github.com/likeca/MyNote"
edition = "2021"

[lib]
name = "mynote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mynote-core = { path = "../../../crates/mynote-core", features = ["plugins", "libgit2"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
imagesize = "0.13"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
dirs = "6"
csv = "1"
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
scraper = { version = "0.27", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon for dark themes (set_dock_icon); the versions and features Tauri already uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
