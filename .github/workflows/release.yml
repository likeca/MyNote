# Builds MyNote for macOS, Windows, Linux and Android, and publishes them as a GitHub release.
#
#   Release:  every push to main. The tests run first; then the commit is tagged with the next
#             version (see the `version` job), every platform builds, and the installers are attached
#             to a draft GitHub release, published once they're all there. If a build fails, the
#             draft stays unpublished: fix it and push again (that's the next version).
#   Version:  0.6.0, then 0.6.1, 0.6.2… on their own. For a bigger step, `npm run version:set 0.7.0`,
#             commit and push: that push is released as 0.7.0.
#   Dry run:  Actions → Release → Run workflow. Builds everything and attaches the installers to the
#             run as downloadable artifacts; publishes nothing.
#
# GitHub Actions must be enabled for the repository (a fork has them off: Actions tab → enable).
#
# In-app updates need your own signing key: `npx tauri signer generate`, put its public key in
# apps/desktop/src-tauri/tauri.conf.json (plugins.updater.pubkey) and the private key in the
# TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) secrets. Without it the release has no latest.json, and
# people update by downloading the new version.
#
# The builds are NOT signed with an Apple Developer ID or a Windows certificate. macOS builds are
# ad-hoc signed, so they run, but Gatekeeper warns on first launch: see the release notes below.
#
# Mobile: the Android app is built as an APK and attached to the same release. Sign it with your own
# key by adding these repository secrets (otherwise each release is signed with a new throwaway key,
# and people must uninstall the previous version before installing the next):
#   ANDROID_KEYSTORE           base64 of the .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password (often the same as the keystore's)
# The iOS app is only built for the simulator, to check it compiles: installing on iPhones needs an
# Apple Developer account (TestFlight / App Store).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in order. Pushes made while one builds wait; if several pile up, only the
# newest runs, and its release includes the commits before it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: v${{ steps.next.outputs.version }}
      # A push to main publishes; a manual run only builds.
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      # The version in tauri.conf.json while it hasn't been released, else the next patch after the
      # newest release of that major.minor: 0.6.0, 0.6.1, 0.6.2… `npm run version:set 0.7.0` (and
      # commit) starts 0.7.x.
      - id: next
        run: |
          base=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          base=${base%%-*}
          IFS=. read -r major minor patch <<< "$base"
          last=$(git ls-remote --tags origin "refs/tags/v$major.$minor.*" | sed -E 's#.*refs/tags/v##; s#\^\{\}$##' \
            | cut -d. -f3 | { grep -E '^[0-9]+$' || true; } | sort -n | tail -n 1)
          next=$(( ${last:--1} + 1 ))
          [ "$patch" -gt "$next" ] && next=$patch
          echo "version=$major.$minor.$next" >> "$GITHUB_OUTPUT"
          echo "Version $major.$minor.$next"
      # Tagged now, after the tests: a build that fails later leaves an unpublished draft, and the
      # next push takes the next number. (Tags pushed with this token don't start workflows.)
      - name: Tag
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tag="v${{ steps.next.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "MyNote $tag" "$GITHUB_SHA"
          git push origin "$tag"

  build:
    name: Build (${{ matrix.name }})
    needs: [checks, version]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Install from the repo root: the app's build also builds the MCP server it bundles.
      - run: npm ci
      # This release's version, in every file that has it (only on the runner: nothing is committed).
      - run: npm run version:set ${{ needs.version.outputs.version }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built into the app for Unsplash cover search (Settings: repository secret UNSPLASH_ACCESS_KEY).
          # Without it the app still builds; people then add their own key in the cover picker.
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Signs the in-app update bundles (repository secret: the contents of the key made by
          # `npx tauri signer generate`; its public half is in tauri.conf.json). With it, the release
          # also gets the latest.json that installed apps check for updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Without the signing key, build without update bundles rather than fail.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && format('--config {0}/apps/desktop/src-tauri/tauri.updater.conf.json', github.workspace) || '' }}
          # A push to main makes the draft release (tagged by `version`), published once everything
          # is attached (see `publish`); a dry run has no tag and only uploads artifacts.
          tagName: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.tag || '' }}
          releaseName: ${{ needs.version.outputs.release == 'true' && format('MyNote {0}', needs.version.outputs.tag) || '' }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          releaseBody: |
            ## Install

            **The easiest and safest way is to build it yourself**: it takes one command and avoids every warning below.
            See [Install](https://github.com/likeca/MyNote#install).

            These downloads are not signed with an Apple or Microsoft certificate.

            - **macOS** (`aarch64` for Apple Silicon, `x64` for Intel): open the `.dmg` and drag MyNote to Applications.
              The first time, macOS says it "can't verify the developer". Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
              Or run once in Terminal: `xattr -dr com.apple.quarantine /Applications/MyNote.app`
            - **Windows**: run the `.exe` installer. If SmartScreen appears, click **More info → Run anyway**.
            - **Linux** (`amd64` or `arm64`): `.AppImage` (make it executable and run it), `.deb` (`sudo apt install ./mynote_*.deb`) or `.rpm`.

            - **Android** (preview): install `MyNote_*_android.apk`. Your phone may ask you to allow installs from your browser or files app.
              To have your desktop workspace on it, open **Settings → Sync** and connect the same git repository. Phone plugins, such as Finance, install from **Settings → Plugins**.

            The MCP server for AI agents needs **Node.js 20+**.
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'Already using MyNote? It offers this update itself, in the sidebar.' || '' }}

  android:
    name: Build (Android)
    # After the desktop builds, so their draft release already exists to attach the APK to.
    needs: [checks, version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run version:set ${{ needs.version.outputs.version }}
      # Through the wrapper: it points OpenSSL's build (git sync) at the NDK's llvm-ranlib.
      - name: Build the APK
        run: npm run android:build -w @mynote/mobile -- --apk
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          version=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          unsigned=apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            alias="$ANDROID_KEY_ALIAS"; store_pass="$ANDROID_KEYSTORE_PASSWORD"; key_pass="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key. People will have to uninstall the previous version before installing this one."
            alias=mynote; store_pass=$(openssl rand -hex 16); key_pass=$store_pass
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$store_pass" -keypass "$key_pass" -dname "CN=MyNote" > /dev/null
          fi
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-mobile
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$alias" \
            --ks-pass "pass:$store_pass" --key-pass "pass:$key_pass" \
            --out "dist-mobile/MyNote_${version}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "dist-mobile/MyNote_${version}_android.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: dist-mobile/*.apk
      - name: Attach to the draft release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist-mobile/*.apk --clobber

  plugins:
    name: Plugins (store packages)
    # After the desktop builds, so the draft release exists to attach to.
    needs: [checks, version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds every plugin, zips it and signs it with the store key (the app only installs plugins
      # signed with it). Writes dist-plugins/plugins.json, which the app reads from the latest release.
      - name: Package and sign
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_KEY" ]; then
            echo "::warning::No PLUGIN_SIGNING_KEY secret: plugins are packaged unsigned, and release builds of the app won't install them."
          fi
          node scripts/package-plugins.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: plugins
          path: dist-plugins/*
      - name: Attach to the draft release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist-plugins/* --clobber

  publish:
    name: Publish the release
    # Once every download is attached: the draft becomes the latest release, which in-app updates
    # and the plugin store read from.
    needs: [version, build, android, plugins]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.build.result == 'success' && needs.android.result == 'success' && needs.plugins.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  ios:
    name: Build (iOS, simulator)
    needs: [checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: npm ci
      # Proves the iOS app builds. Distributing it needs an Apple Developer account, so nothing is attached.
      - run: npm run tauri -w @mynote/mobile -- ios build --target aarch64-sim --debug
