<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    App icon, on Apple's macOS icon grid: a light blue block outline with an "N", everything else
    transparent (the block's face too, so the background shows through, light or dark), well inside
    the 824px icon shape so the system's rounded edge never cuts into it. The in-app logo is the same
    block, cropped to its edges.
  -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC8F8" />
      <stop offset="1" stop-color="#3A9FE8" />
    </linearGradient>
    <!-- The block's thickness shows only outside its face, which is see-through. -->
    <mask id="outside-face" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white" />
      <rect x="152" y="152" width="680" height="680" rx="76" fill="black" stroke="black" stroke-width="38" />
    </mask>
  </defs>
  <g transform="translate(512 512) scale(0.66) translate(-512 -512)">
    <!-- The block's thickness, showing below and to the right of its face. -->
    <rect x="192" y="192" width="680" height="680" rx="76" fill="url(#side)" stroke="#3A9FE8" stroke-width="30" stroke-linejoin="round" mask="url(#outside-face)" />
    <!-- Its face: just the outline. -->
    <rect x="152" y="152" width="680" height="680" rx="76" fill="none" stroke="#4AAEF2" stroke-width="38" />
    <!-- SF Pro Black (Apple's system font, heaviest weight). y puts the letter's ink in the middle of
         the face (152..832, centre 492): "central" centres the font's em box, which sits the N low. -->
    <text x="492" y="480" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, system-ui, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="500" fill="#4AAEF2">N</text>
  </g>
</svg>
