<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: a block with an "N", in light blue. Inside macOS's 824px icon grid. -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC8F8" />
      <stop offset="1" stop-color="#3A9FE8" />
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F1F8FE" />
    </linearGradient>
  </defs>
  <!-- The block's thickness, showing below and to the right of its face. -->
  <rect x="192" y="192" width="680" height="680" rx="76" fill="url(#side)" stroke="#3A9FE8" stroke-width="30" stroke-linejoin="round" />
  <!-- Its face. -->
  <rect x="152" y="152" width="680" height="680" rx="76" fill="url(#face)" stroke="#4AAEF2" stroke-width="38" />
  <text x="492" y="508" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="560" fill="#4AAEF2">N</text>
</svg>
